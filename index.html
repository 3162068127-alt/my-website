<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>单品爆款 · 官方售卖页</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .product-img {
            width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        .price {
            font-size: 24px;
            color: #e63946;
            font-weight: bold;
            margin: 10px 0;
        }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #1d3557;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
            margin-top: 20px;
        }
        .section {
            margin: 25px 0;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>【产品名称】官方售卖页</h1>

    <img src="https://via.placeholder.com/600x350" class="product-img">

    <div class="section">
        <h2>产品介绍</h2>
        <p>这里写你的单品爆款介绍：它解决什么问题、为什么别人需要它、它的核心价值是什么。</p>
    </div>

    <div class="section">
        <h2>产品特点</h2>
        <ul>
            <li>特点 1</li>
            <li>特点 2</li>
            <li>特点 3</li>
        </ul>
    </div>

    <div class="section">
        <h2>价格</h2>
        <p class="price">¥ 99</p>
    </div>

    <div class="section">
        <h2>购买方式</h2>
        <p>添加微信购买：</p>
        <img src="你的二维码链接" style="width:200px;">
    </div>

    <a class="btn" href="你的联系链接">立即购买</a>

    <div class="footer">
        © 2026 狼 · 官方售卖页
    </div>
</div>

</body>
</html>
